<svg xmlns="http://www.w3.org/2000/svg" width="360" height="250" viewBox="0 0 360 250" fill="none">
  <defs>
    <linearGradient id="green" x1="90" y1="38" x2="282" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F99D"/><stop offset=".48" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="light" x1="155" y1="128" x2="240" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFCCB"/><stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- soft circular badge -->
  <circle cx="177" cy="124" r="103" fill="#052E16" stroke="#22C55E" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="177" cy="124" r="92" stroke="#4ADE80" stroke-opacity=".15" stroke-width="1.5"/>
  <!-- simple leaves frame the character -->
  <path d="M43 203C50 160 39 128 19 108C58 120 78 157 65 202Z" fill="#166534" opacity=".7"/>
  <path d="M309 205C324 166 321 139 342 115C349 158 338 190 309 205Z" fill="#166534" opacity=".7"/>
  <!-- tail curled upward -->
  <path d="M228 160C273 158 297 177 290 198C284 216 253 213 248 196C245 185 258 181 265 189" stroke="#14532D" stroke-width="27" stroke-linecap="round"/>
  <path d="M228 160C273 158 297 177 290 198C284 216 253 213 248 196C245 185 258 181 265 189" stroke="url(#green)" stroke-width="20" stroke-linecap="round"/>
  <!-- body -->
  <path d="M112 129C122 101 157 91 190 103C222 114 244 139 238 165C232 190 201 202 168 195C137 189 109 164 112 129Z" fill="url(#green)" stroke="#14532D" stroke-width="4"/>
  <!-- belly -->
  <path d="M129 151C156 166 193 172 224 151C224 175 202 188 177 185C154 182 136 169 129 151Z" fill="url(#light)" opacity=".95"/>
  <g stroke="#65A30D" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M151 160L154 178"/><path d="M170 166L171 184"/><path d="M190 166L188 184"/><path d="M208 160L203 177"/>
  </g>
  <!-- friendly dorsal crest -->
  <path d="M115 124L105 103L126 114L132 91L148 110L162 91L175 111L192 101L199 120" fill="#86EFAC" stroke="#166534" stroke-width="3" stroke-linejoin="round"/>
  <!-- feet -->
  <path d="M143 177L126 196L106 201M152 181L143 204L127 211M207 177L220 195L238 199" stroke="#15803D" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 201L96 199M127 211L117 214M238 199L248 196" stroke="#BBF7D0" stroke-width="3" stroke-linecap="round"/>
  <!-- head -->
  <path d="M185 56C165 42 137 45 119 57C105 66 100 80 107 94C115 109 138 115 160 106L186 95C201 86 202 69 185 56Z" fill="url(#green)" stroke="#14532D" stroke-width="4"/>
  <!-- cheek -->
  <path d="M119 88C130 98 147 100 160 92" stroke="#D9F99D" stroke-width="4" stroke-linecap="round" opacity=".85"/>
  <!-- eye, bright and expressive -->
  <ellipse cx="153" cy="69" rx="19" ry="18" fill="#14532D"/>
  <ellipse cx="154" cy="69" rx="13" ry="13" fill="#FDE047" filter="url(#glow)"/>
  <ellipse cx="157" cy="69" rx="3.8" ry="9" fill="#111827"/>
  <circle cx="149" cy="64" r="3.5" fill="#FFFFFF"/>
  <!-- brow -->
  <path d="M137 53C148 46 163 48 171 55" stroke="#ECFCCB" stroke-width="4" stroke-linecap="round"/>
  <!-- nostril and little smile -->
  <circle cx="112" cy="83" r="2.5" fill="#14532D"/>
  <path d="M109 92C121 101 135 101 144 95" stroke="#14532D" stroke-width="2.8" stroke-linecap="round"/>
  <!-- subtle scales -->
  <g fill="#ECFCCB" opacity=".85">
    <circle cx="126" cy="72" r="2"/><circle cx="137" cy="83" r="2"/><circle cx="167" cy="84" r="2"/>
    <circle cx="181" cy="73" r="2"/><circle cx="193" cy="128" r="2"/><circle cx="210" cy="139" r="2"/>
    <circle cx="222" cy="153" r="2"/><circle cx="181" cy="151" r="2"/><circle cx="164" cy="147" r="2"/>
  </g>
  <!-- tiny sparkle -->
  <path d="M264 58V72M257 65H271" stroke="#BEF264" stroke-width="3" stroke-linecap="round"/>
</svg>