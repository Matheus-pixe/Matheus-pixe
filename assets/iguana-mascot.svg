<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280" role="img" aria-labelledby="title desc">
  <title id="title">Iggy, a iguana verde do Matheus.exe</title>
  <desc id="desc">Mascote simpática em estilo vetorial, verde-lima, com crista, cauda curvada e expressão confiante.</desc>
  <defs>
    <linearGradient id="body" x1="95" y1="45" x2="260" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9F99D"/><stop offset=".48" stop-color="#4ADE80"/><stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="belly" x1="135" y1="145" x2="235" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDF4"/><stop offset="1" stop-color="#BBF7D0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#022C22" flood-opacity=".5"/>
    </filter>
  </defs>
  <!-- clean badge -->
  <ellipse cx="180" cy="246" rx="95" ry="10" fill="#052E16" opacity=".45"/>
  <circle cx="180" cy="132" r="113" fill="#052E16" stroke="#22C55E" stroke-opacity=".55" stroke-width="2"/>
  <circle cx="180" cy="132" r="103" stroke="#86EFAC" stroke-opacity=".18" stroke-width="1.5"/>
  <g filter="url(#shadow)" stroke="#14532D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- curled tail -->
    <path d="M220 174C264 169 290 190 285 211C281 230 253 229 248 211C245 201 255 194 264 201" stroke="#14532D" stroke-width="25" fill="none"/>
    <path d="M220 174C264 169 290 190 285 211C281 230 253 229 248 211C245 201 255 194 264 201" stroke="url(#body)" stroke-width="18" fill="none"/>
    <!-- body -->
    <path d="M116 139C125 112 154 101 184 109C215 117 238 140 238 165C238 192 210 210 178 208C146 206 117 186 112 164C110 155 112 146 116 139Z" fill="url(#body)"/>
    <!-- belly -->
    <path d="M132 164C158 178 197 180 225 159C226 183 204 198 179 198C157 197 139 184 132 164Z" fill="url(#belly)" stroke="#16A34A" stroke-width="2.5"/>
    <path d="M155 177L158 191M176 181L176 197M197 178L195 194M214 171L210 187" stroke="#86EFAC" stroke-width="2.5"/>
    <!-- legs -->
    <path d="M143 184L126 204L106 210M151 189L145 209L130 216" fill="none" stroke-width="11"/>
    <path d="M207 185L224 202L242 205" fill="none" stroke-width="11"/>
    <path d="M105 210L96 208M130 216L121 219M242 205L251 202" stroke="#BBF7D0" stroke-width="3"/>
    <!-- neck -->
    <path d="M143 108C149 91 169 84 187 96C203 107 208 126 211 145L190 169C170 169 153 156 146 139Z" fill="url(#body)"/>
    <!-- crest -->
    <path d="M110 121L102 99L122 111L130 88L145 108L160 87L174 108L190 97L199 119" fill="#86EFAC" stroke="#166534" stroke-width="3.5"/>
    <!-- head -->
    <path d="M188 52C170 38 145 40 128 50C112 59 105 73 112 88C119 103 140 109 160 101L185 91C201 83 205 65 188 52Z" fill="url(#body)"/>
    <!-- cheek -->
    <path d="M122 85C132 94 146 96 159 90" fill="none" stroke="#ECFCCB" stroke-width="3.5"/>
    <!-- expressive eye -->
    <ellipse cx="157" cy="66" rx="18" ry="18" fill="#14532D" stroke="none"/>
    <ellipse cx="158" cy="66" rx="12.5" ry="13.5" fill="#FDE047" stroke="none"/>
    <ellipse cx="161" cy="66" rx="3.5" ry="9" fill="#172554" stroke="none"/>
    <circle cx="153" cy="61" r="3.5" fill="#FFFFFF" stroke="none"/>
    <path d="M141 51C150 45 163 46 171 53" fill="none" stroke="#F0FDF4" stroke-width="4"/>
    <!-- nostril and friendly smile -->
    <circle cx="116" cy="79" r="2.5" fill="#14532D" stroke="none"/>
    <path d="M113 88C124 97 138 98 147 91" fill="none" stroke="#14532D" stroke-width="2.8"/>
  </g>
  <!-- subtle scale spots -->
  <g fill="#F0FDF4" opacity=".85">
    <circle cx="132" cy="69" r="2"/><circle cx="140" cy="80" r="2"/><circle cx="174" cy="81" r="2.2"/>
    <circle cx="187" cy="69" r="2"/><circle cx="194" cy="129" r="2"/><circle cx="211" cy="144" r="2"/>
    <circle cx="222" cy="159" r="2"/><circle cx="186" cy="151" r="2"/><circle cx="164" cy="148" r="2"/>
  </g>
  <!-- tiny sparkle, a small tech accent -->
  <path d="M266 65V79M259 72H273" stroke="#BEF264" stroke-width="3" stroke-linecap="round"/>
  <circle cx="89" cy="151" r="3" fill="#4ADE80"/>
</svg>