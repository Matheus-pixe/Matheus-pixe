<svg xmlns="http://www.w3.org/2000/svg" width="240" height="200" viewBox="0 0 240 200" role="img" aria-labelledby="title desc">
  <title id="title">Iguana Matheus.exe</title>
  <desc id="desc">Logo limpa de uma iguana vista de lado, com focinho definido, crista curta, olho simples e cauda enrolada.</desc>
  <g fill="#A3E635" stroke="#A3E635" stroke-linecap="round" stroke-linejoin="round">
