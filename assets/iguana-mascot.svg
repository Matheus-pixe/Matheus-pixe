    <path d="M119 129C151 132 174 146 174 165C174 182 156 190 142 181C131 174 136 160 147 159C155 159 159 166 155 171C151 175 145 172 147 168C140 171 143 179 151 180C163 182 170 172 166 162C161 149 143 143 119 142Z" stroke="none"/>
    <!-- Corpo e pescoço -->
    <path d="M62 112C66 88 87 74 112 76C134 77 150 91 157 109L178 116L178 129L151 132C141 146 122 153 99 148C77 144 62 131 62 112Z" stroke="none"/>
    <!-- Cabeça e focinho -->
    <path d="M94 83C101 66 118 57 137 61C151 64 159 73 165 84L185 90C192 92 192 99 184 102L161 106C151 115 135 117 120 110L105 105C95 101 90 93 94 83Z" stroke="none"/>
    <!-- Patas simples -->
