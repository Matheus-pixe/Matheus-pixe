    <!-- Crista dorsal discreta -->
    <path d="M94 79L91 63L104 73L111 56L122 71L132 59L139 76L151 72L154 88Z" stroke="none"/>
  </g>
  <!-- olho simples e expressivo -->
  <circle cx="143" cy="78" r="7" fill="#052E16"/>
