<title id="title">Mascote iguana Matheus.exe</title>
<desc id="desc">Símbolo da iguana recortado diretamente da imagem enviada, com silhueta arredondada, focinho curvado, olho em espiral, crista e cauda enrolada. Cor verde-lima para combinar com o perfil.</desc>
