  <path d="M257 178C245 197 225 208 205 218L179 242C175 249 184 254 190 249L215 232L249 219L282 199Z" fill="url(#skin)" stroke="#052E16" stroke-width="4" stroke-linejoin="round"/>
  <path d="M186 244L171 258M192 248L185 264M200 239L201 255" stroke="#86EFAC" stroke-width="4" stroke-linecap="round"/>
  <!-- rear leg -->
  <path d="M329 183C342 196 355 209 357 228L380 243C388 249 380 257 373 253L345 238L328 218L307 204Z" fill="#15803D" stroke="#052E16" stroke-width="4" stroke-linejoin="round"/>
  <path d="M378 247L395 253M373 251L384 264M366 246L368 261" stroke="#86EFAC" stroke-width="4" stroke-linecap="round"/>
  <!-- neck -->
  <path d="M229 98C248 99 272 110 286 135L311 177C298 194 279 201 259 196C239 190 226 171 219 147L210 121Z" fill="url(#skin)" stroke="#052E16" stroke-width="5" stroke-linejoin="round"/>
  <!-- head silhouette, peeking left -->
  <path d="M282 51C265 38 239 40 223 48C205 49 192 58 184 69L151 76C143 79 143 86 151 89L178 97C184 109 201 116 219 112L248 103C270 98 291 82 294 68Z" fill="url(#skin)" stroke="#052E16" stroke-width="5" stroke-linejoin="round"/>
  <!-- brow ridge -->
  <path d="M202 60C211 49 231 46 247 54C231 54 221 59 215 69Z" fill="#BBF7D0" opacity=".65"/>
  <!-- eye socket and eye -->
  <ellipse cx="222" cy="67" rx="19" ry="15" fill="#052E16" stroke="#166534" stroke-width="3"/>
  <ellipse cx="222" cy="67" rx="12" ry="11" fill="url(#eye)" filter="url(#glow)"/>
  <ellipse cx="225" cy="67" rx="3.2" ry="9" fill="#07130A"/>
  <circle cx="218" cy="63" r="3" fill="#F0FDF4"/>
