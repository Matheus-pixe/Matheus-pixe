<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="skin" x1="110" y1="45" x2="335" y2="238" gradientUnits="userSpaceOnUse">
      <stop stop-color="#86EFAC"/>
      <stop offset=".42" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="belly" x1="190" y1="105" x2="325" y2="218" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BBF7D0"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="eye" cx="0" cy="0" r="1" gradientTransform="matrix(15 8 -8 15 223 70)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FDE68A"/>
      <stop offset=".5" stop-color="#A3E635"/>
      <stop offset="1" stop-color="#365314"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- shadowy leaves -->
  <g stroke="#166534" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 270C66 211 72 156 54 103C94 145 99 207 65 269" fill="#052E16"/>
    <path d="M52 269C102 222 136 194 175 181C148 225 104 254 52 269" fill="#064E3B"/>
    <path d="M387 278C344 216 347 161 380 115C400 171 403 226 387 278" fill="#052E16"/>
    <path d="M400 270C353 235 323 215 293 206C319 246 360 267 400 270" fill="#064E3B"/>
    <path d="M99 300C117 260 141 235 171 219C161 261 140 285 99 300" fill="#14532D"/>
    <path d="M327 300C304 262 293 236 289 208C325 236 344 264 327 300" fill="#14532D"/>
  </g>
  <!-- tail and body -->
  <path d="M300 191C348 195 378 218 395 250C366 243 337 235 310 220C281 246 233 253 203 235C179 220 180 191 203 174L300 191Z" fill="url(#skin)" stroke="#052E16" stroke-width="5" stroke-linejoin="round"/>
  <path d="M204 205C241 227 287 222 322 204C301 237 245 248 214 229Z" fill="url(#belly)" opacity=".9"/>
  <!-- back spines -->
  <path d="M185 155L176 128L197 143L202 113L218 136L229 106L244 133L261 108L271 137L292 122L297 151" fill="#4ADE80" stroke="#166534" stroke-width="4" stroke-linejoin="round"/>
