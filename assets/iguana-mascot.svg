  <g fill="#BBF7D0" opacity=".8">
    <circle cx="194" cy="80" r="2"/><circle cx="204" cy="88" r="2"/><circle cx="215" cy="98" r="2"/>
    <circle cx="238" cy="81" r="2"/><circle cx="252" cy="74" r="2"/><circle cx="259" cy="85" r="2"/>
    <circle cx="276" cy="73" r="2"/><circle cx="270" cy="91" r="2"/><circle cx="290" cy="162" r="2"/>
    <circle cx="301" cy="170" r="2"/><circle cx="283" cy="179" r="2"/><circle cx="267" cy="170" r="2"/>
    <circle cx="243" cy="184" r="2"/><circle cx="259" cy="187" r="2"/><circle cx="320" cy="211" r="2"/>
  </g>
  <!-- leaf in foreground to camouflage mascot -->
  <path d="M99 273C142 231 181 222 222 227C193 264 151 279 99 273Z" fill="#052E16" stroke="#15803D" stroke-width="3" stroke-linejoin="round"/>
  <path d="M110 270L202 234" stroke="#22C55E" stroke-width="2" stroke-linecap="round"/>
  <path d="M320 294C340 250 366 232 405 223C395 260 367 285 320 294Z" fill="#052E16" stroke="#15803D" stroke-width="3" stroke-linejoin="round"/>
