<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Matheus.exe — cabeçalho animado</title>
  <desc id="desc">Cabeçalho estilo terminal verde; o nome Matheus.exe e a linha de status aparecem com efeito de digitação.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
    <clipPath id="nameReveal"><rect x="40" y="58" width="0" height="48"><animate attributeName="width" values="0;310;310;0" keyTimes="0;0.48;0.78;1" dur="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="statusReveal"><rect x="40" y="170" width="0" height="28"><animate attributeName="width" values="0;310;310;0" keyTimes="0;0.5;0.8;1" dur="6s" begin=".8s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect x="5" y="5" width="890" height="220" rx="18" fill="#0B1110" stroke="url(#border)" stroke-width="2"/>
  <path d="M6 48H894" stroke="#24523A" stroke-width="1"/>
  <circle cx="29" cy="27" r="6" fill="#FB7185"/>
  <circle cx="49" cy="27" r="6" fill="#FACC15"/>
  <circle cx="69" cy="27" r="6" fill="#4ADE80"/>
  <text x="90" y="32" font-family="monospace" font-size="13" fill="#A7F3D0">MATHEUS.EXE / PROFILE</text>
  <text x="42" y="94" font-family="monospace" font-size="13" fill="#86EFAC">$ iniciar_perfil</text>
  <text x="42" y="151" font-family="monospace" font-size="42" font-weight="700" fill="#D9F99D" clip-path="url(#nameReveal)">Matheus.exe</text>
  <rect x="42" y="116" width="12" height="3" rx="1" fill="#4ADE80"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
  <text x="42" y="192" font-family="monospace" font-size="16" fill="#86EFAC" clip-path="url(#statusReveal)">▶ status: em desenvolvimento</text>
  <text x="858" y="198" text-anchor="end" font-family="monospace" font-size="12" fill="#4ADE80">LVL 01 · BUILD IN PROGRESS</text>
</svg>