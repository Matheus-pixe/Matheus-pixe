<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="title desc">
  <title id="title">Matheus.exe — cabeçalho animado</title>
  <desc id="desc">Cabeçalho estilo terminal verde com efeito de digitação no nome Matheus.exe e na linha de status.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/><stop offset="1" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="890" height="220" rx="18" fill="#0B1110" stroke="url(#border)" stroke-width="2"/>
  <path d="M6 48H894" stroke="#24523A" stroke-width="1"/>
  <circle cx="29" cy="27" r="6" fill="#FB7185"/>
  <circle cx="49" cy="27" r="6" fill="#FACC15"/>
  <circle cx="69" cy="27" r="6" fill="#4ADE80"/>
  <text x="90" y="32" font-family="monospace" font-size="13" fill="#A7F3D0">MATHEUS.EXE / PROFILE</text>
  <text x="42" y="94" font-family="monospace" font-size="13" fill="#86EFAC">$ iniciar_perfil</text>
  <text x="42" y="151" font-family="monospace" font-size="42" font-weight="700" fill="#D9F99D">Matheus.exe<tspan fill="#4ADE80">_</tspan>
    <animate attributeName="opacity" values="1;1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
  </text>
  <rect x="42" y="166" width="0" height="2" rx="1" fill="#4ADE80">
    <animate attributeName="width" values="0;300;300" keyTimes="0;0.75;1" dur="2.2s" repeatCount="indefinite"/>
  </rect>
  <text x="42" y="198" font-family="monospace" font-size="16" fill="#86EFAC">▶ status: <tspan fill="#F0FDF4">em desenvolvimento</tspan>
    <animate attributeName="opacity" values="0.25;1;1" keyTimes="0;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </text>
  <text x="858" y="198" text-anchor="end" font-family="monospace" font-size="12" fill="#4ADE80">LVL 01 · BUILD IN PROGRESS</text>
</svg>